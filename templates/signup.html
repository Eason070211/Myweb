{% extends "base.html" %}

{% block title %}Sign Up - Eason's Website{% endblock %}

{% block content %}
<script>document.querySelectorAll('[toggle-password]').forEach(function(toggle){toggle.addEventListener('click',function(){var t=document.querySelector(this.getAttribute('toggle-password'));if(t.type==='password'){t.type='text';this.classList.remove('fa-eye');this.classList.add('fa-eye-slash');}else{t.type='password';this.classList.remove('fa-eye-slash');this.classList.add('fa-eye');}});});</script>
<div class="post-block auth-form-container">
    <h2 class="auth-form-title">Sign Up</h2>
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" required minlength="3" maxlength="20" autocomplete="username">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div style="position: relative;">
                <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="new-password" style="padding-right: 40px;">
                <i class="fas fa-eye" toggle-password="#password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <div style="position: relative;">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password" style="padding-right: 40px;">
                <i class="fas fa-eye" toggle-password="#confirm_password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
    </form>
    
    <p class="auth-form-footer">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </p>
</div>
{% endblock %}
