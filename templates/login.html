{% extends "base.html" %}

{% block title %}Login - Eason's Website{% endblock %}

{% block content %}
<script>document.querySelectorAll('[toggle-password]').forEach(function(toggle){toggle.addEventListener('click',function(){var t=document.querySelector(this.getAttribute('toggle-password'));if(t.type==='password'){t.type='text';this.classList.remove('fa-eye');this.classList.add('fa-eye-slash');}else{t.type='password';this.classList.remove('fa-eye-slash');this.classList.add('fa-eye');}});});</script>
<div class="post-block">
    <h2 class="auth-form-title">Login</h2>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div style="position: relative;">
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" style="padding-right: 40px;">
                <i class="fas fa-eye" toggle-password="#password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" name="remember"> Remember me
            </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    
    <p class="auth-form-footer">
        No account? <a href="{{ url_for('signup') }}">Sign up</a>
    </p>
</div>
{% endblock %}
