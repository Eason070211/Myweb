{% if posts %}
    {% for post in posts %}
    <article class="post-block animated fadeIn">
        <header class="post-header">
            <h2 class="post-title">
                <a href="#" onclick="loadPost({{ post.id }}); return false;">{{ post.title }}</a>
                {% if is_admin or current_user_id == post.author_id %}
                <a href="#" onclick="loadPage('edit_post', {{ post.id }}); return false;" class="edit-post-btn-inline" title="编辑"><i class="fas fa-edit"></i></a>
                <form method="POST" action="/post/{{ post.id }}/delete" style="display:inline;" onsubmit="return confirm('确定删除这篇帖子吗？');">
                    <button type="submit" class="delete-post-btn" title="删除帖子"><i class="fas fa-trash-alt"></i></button>
                </form>
                {% endif %}
            </h2>
            <div class="post-meta-container">
                <div class="post-meta">
                    <span class="post-meta-item">
                        <span class="post-meta-item-icon"><i class="far fa-user"></i></span>
                        <span class="post-meta-item-text">{{ post.author }}</span>
                    </span>
                    <span class="post-meta-item">
                        <span class="post-meta-item-icon"><i class="far fa-calendar"></i></span>
                        <time title="创建时间" datetime="{{ post.date }}">{{ post.date }}</time>
                    </span>
                    <span class="post-meta-item">
                        <span class="post-meta-item-icon"><i class="far fa-folder"></i></span>
                        <span class="post-meta-item-text">分类于</span>
                        <a href="#" onclick="loadPage('categories'); return false;">{{ post.category }}</a>
                    </span>
                </div>
            </div>
        </header>
        
        <div class="post-body">
            <p>{{ post.summary }}</p>
            <div class="post-button">
                <a class="btn" href="#" onclick="loadPost({{ post.id }}); return false;">阅读全文 »</a>
            </div>
        </div>
        
        <footer class="post-footer">
            <div class="post-eof"></div>
        </footer>
    </article>
    {% endfor %}
{% else %}
<article class="post-block">
    <div style="text-align: center; padding: 2rem;">
        <p style="font-size: 1.2rem; color: #888;">✨ 暂无帖子，快去创作吧 ✨</p>
    </div>
</article>
{% endif %}

<style>
.edit-post-btn-inline {
    background: rgba(59, 130, 246, 0.15);
    border: none;
    color: #7ba9ff;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0.3rem 0.7rem;
    border-radius: 1rem;
    margin-left: 10px;
    transition: 0.2s;
    text-decoration: none;
}
.edit-post-btn-inline:hover {
    background: #3b82f6;
    color: white;
}
.delete-post-btn {
    background: rgba(255, 80, 80, 0.15);
    border: none;
    color: #ff9e9e;
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0.3rem 0.7rem;
    border-radius: 1rem;
    margin-left: 5px;
    transition: 0.2s;
}
.delete-post-btn:hover {
    background: #ff5555;
    color: white;
}
</style>
